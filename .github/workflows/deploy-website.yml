name: Deploy website

# Publishes website/ to Appwrite Sites whenever it changes on main.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "tools/deploy_website.sh"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Appwrite Sites
        env:
          APPWRITE_SITES_KEY: ${{ secrets.APPWRITE_SITES_KEY }}
        run: |
          if [ -z "$APPWRITE_SITES_KEY" ]; then
            echo "::warning::APPWRITE_SITES_KEY secret not set yet, skipping deploy"
            exit 0
          fi
          bash tools/deploy_website.sh
